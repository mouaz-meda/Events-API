name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # --load puts the image into the local Docker store so `docker run` can find it
        run: docker build --load -t events-api:latest .

      - name: Run container
        run: docker run -d --name events-api -p 5000:5000 events-api:latest

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/api/health; then
              echo; echo "API is healthy"; exit 0
            fi
            echo "Waiting for API... ($i)"; sleep 2
          done
          docker logs events-api
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          BASE_URL: http://localhost:5000
        run: pytest -v

      - name: Stop and remove container
        if: always()
        run: |
          docker stop events-api || true
          docker rm events-api || true

  deploy:
    needs: test
    # deploy only on pushes to main, never on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/events-api:${{ github.sha }}

      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for Render rollout
        run: sleep 60

      - name: Smoke test Render health endpoint
        run: |
          # Render can take a few minutes (and free instances cold-start), so retry for up to ~5 min
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_BASE_URL }}/api/health" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "Render deployment is healthy"; exit 0; fi
            sleep 15
          done
          echo "Smoke test failed: /api/health never returned 200"
          exit 1
