name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # --load puts the image into the local Docker store so `docker run` can find it
        run: docker build --load -t events-api:latest .

      - name: Run container
        run: docker run -d --name events-api -p 5000:5000 events-api:latest

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/api/health; then
              echo; echo "API is healthy"; exit 0
            fi
            echo "Waiting for API... ($i)"; sleep 2
          done
          docker logs events-api
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          BASE_URL: http://localhost:5000
        run: pytest -v

      - name: Stop and remove container
        if: always()
        run: |
          docker stop events-api || true
          docker rm events-api || true
